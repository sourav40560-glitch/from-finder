<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Form Entry ID Finder</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;padding:16px;max-width:650px;margin:auto;background:#f8f8ff}
h2{text-align:center;margin-bottom:5px}
p.sub{text-align:center;color:#555}
input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:15px}
button{padding:13px;width:100%;background:#673ab7;color:#fff;border:0;border-radius:10px;font-size:16px;margin-top:10px;cursor:pointer}
.card{background:#fff;padding:14px;margin-top:12px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.q{font-weight:bold;font-size:16px}
.id{color:#673ab7;margin:6px 0;word-break:break-all;font-size:14px}
.small{padding:8px 12px;width:auto;background:#eee;color:#000;font-size:13px;margin-top:5px}
.prefill{width:100%;padding:10px;margin-top:10px}
#loader{display:none;text-align:center;margin-top:15px}
#status{font-size:12px;color:#888;text-align:center;margin-top:8px}
</style>
</head>
<body>

<h2>🔍 Google Form Entry ID Finder</h2>
<p class="sub">শুধু Form এর লিংক Paste করো</p>

<input id="url" placeholder="https://docs.google.com/forms/d/e/.../viewform">
<button onclick="findIds()">Entry ID বের করো</button>
<div id="loader">খুঁজতেছি... ⏳</div>
<div id="status"></div>
<div id="result"></div>

<script>
async function fetchWithProxies(formUrl){
  const proxies = [
    "https://api.allorigins.win/raw?url=",
    "https://api.allorigins.win/get?url=",
    "https://api.codetabs.com/v1/proxy?quest=",
    "https://corsproxy.io/?url=",
    "https://api.cors.lol/?url=",
    "https://proxy.cors.sh/",
    "https://cors.isomorphic-git.org/",
    "https://whateverorigin.org/get?url=",
    "https://thingproxy.freeboard.io/fetch/",
    "https://corsproxy.org/?",
    "https://test.cors.workers.dev/?",
    "https://proxy.corsfix.com/?"
  ];

  for(let i=0;i<proxies.length;i++){
    let p = proxies[i];
    try{
      document.getElementById('status').innerText = `Proxy ${i+1}/${proxies.length} ট্রাই করতেছি...`;
      let controller = new AbortController();
      let timeout = setTimeout(()=>controller.abort(), 8000);
      let res = await fetch(p + encodeURIComponent(formUrl), { signal: controller.signal });
      clearTimeout(timeout);
      let text = await res.text();
      if(text.startsWith('{') && text.includes('contents')){
        try{ text = JSON.parse(text).contents; }catch(e){}
      }
      if(text && text.includes('entry.')){
        document.getElementById('status').innerText = `✅ Proxy ${i+1} দিয়ে পাওয়া গেছে!`;
        return text;
      }
      if(text && text.length > 20000) return text;
    }catch(e){ continue; }
  }
  throw new Error("সব Proxy Fail করছে");
}

async function findIds(){
  let formUrl = document.getElementById('url').value.trim();
  let result = document.getElementById('result');
  let loader = document.getElementById('loader');
  if(!formUrl.includes('http')){ alert('সঠিক লিংক দাও'); return; }
  loader.style.display='block';
  result.innerHTML='';
  try{
    let html = await fetchWithProxies(formUrl);
    let ids = [...new Set(html.match(/entry\.\d+/g) || [])];
    if(ids.length===0){
      result.innerHTML = "<div class='card'>❌ পাওয়া যায়নি।<br>1. forms.gle হলে Chrome এ ওপেন করে বড় লিংকটা কপি করো<br>2. Form টা Public কিনা দেখো</div>";
      loader.style.display='none';
      return;
    }
    let baseUrl = formUrl.split('/viewform')[0] + '/viewform';
    let m = html.match(/https:\/\/docs\.google\.com\/forms\/d\/e\/[^\/"]+\/formResponse/);
    if(m) baseUrl = m[0].replace('/formResponse','/viewform');
    let formResponseUrl = baseUrl.replace('/viewform','/formResponse');
    window._ids = ids;
    window._baseUrl = baseUrl;
    let out = `
    <div class="card" style="background:#e8e5ff">
      <div class="q">🔗 FormResponse Link</div>
      <div class="id">${formResponseUrl}</div>
      <button class="small" style="background:#673ab7;color:#fff" onclick="navigator.clipboard.writeText('${formResponseUrl}');this.innerText='Copied ✅'">Copy FormResponse</button>
    </div>
    <div class="card" style="background:#e8e5ff">
      <div class="q">👁️ ViewForm Link</div>
      <div class="id">${baseUrl}</div>
      <button class="small" style="background:#673ab7;color:#fff" onclick="navigator.clipboard.writeText('${baseUrl}');this.innerText='Copied ✅'">Copy ViewForm</button>
    </div>
    <h3>✅ মোট ${ids.length} টা Entry ID পাওয়া গেছে</h3>`;
    ids.forEach((id, i)=>{
      out += `
      <div class="card">
        <div class="q">প্রশ্ন ${i+1}</div>
        <div class="id">${id}</div>
        <button class="small" onclick="navigator.clipboard.writeText('${id}');this.innerText='Copied ✅'">Copy ID</button>
        <input class="prefill" id="val-${i}" placeholder="উত্তর লিখো">
        <button class="small" style="background:#673ab7;color:#fff" onclick="makePrefill('${id}', ${i})">Prefill Link বানাও</button>
        <div id="link-${i}" style="word-break:break-all;margin-top:8px"></div>
      </div>`;
    });
    out += `<button onclick="makeAllPrefill()">সব উত্তর দিয়ে একসাথে Prefill Link বানাও</button><div id="allLink" style="word-break:break-all;margin-top:10px"></div>`;
    result.innerHTML = out;
  }catch(e){
    result.innerHTML = "<div class='card'>❌ Error: "+e.message+"<br><br>আবার ট্রাই করো</div>";
  }
  loader.style.display='none';
}
function makePrefill(id, i){
  let val = document.getElementById('val-'+i).value;
  let link = window._baseUrl + "?usp=pp_url&" + id + "=" + encodeURIComponent(val);
  document.getElementById('link-'+i).innerHTML = `<a href="${link}" target="_blank">${link}</a><br><button class="small" onclick="navigator.clipboard.writeText('${link}')">Copy Link</button>`;
}
function makeAllPrefill(){
  let params = window._ids.map((id,i)=>{
    let v = document.getElementById('val-'+i)?.value || "";
    return id + "=" + encodeURIComponent(v);
  }).join('&');
  let link = window._baseUrl + "?usp=pp_url&" + params;
  document.getElementById('allLink').innerHTML = `<a href="${link}" target="_blank">${link}</a><br><button class="small" onclick="navigator.clipboard.writeText('${link}')">Copy Full Link</button>`;
}
</script>
</body>
</html>
