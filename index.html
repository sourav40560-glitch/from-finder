আমি <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Form Entry ID Finder</title>
<style>
body{font-family:sans-serif;padding:16px;max-width:650px;margin:auto;background:#f8f8ff}
h2{text-align:center;}
input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:15px;margin-bottom:10px;}
button{padding:14px;width:100%;background:#673ab7;color:#fff;border:0;border-radius:10px;font-size:16px;cursor:pointer;}
.card{background:#fff;padding:15px;margin-top:15px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.id{color:#673ab7;font-weight:bold;font-size:16px;margin:5px 0}
.small-btn{padding:8px 12px;width:auto;background:#eee;color:#000;font-size:14px;margin-top:5px;}
</style>
</head>
<body>

<h2>🔍 Form Entry ID Finder</h2>

<input id="url" placeholder="এখানে ফর্মের লিংক দিন..." value="https://docs.google.com/forms/d/e/1FAIpQLSdhhglQpafBPp3Y2XqXnPh1zp-S1t6kqY1RsRdW3hgeUSg3oQ/viewform">
<button onclick="findIds()">Entry ID বের করো</button>

<div id="status" style="text-align:center; margin-top:10px; color:#555;"></div>
<div id="result"></div>

<script>
const MY_WORKER_URL = "https://my-form-proxy.rokib40560.workers.dev";

async function findIds(){
  const formUrl = document.getElementById('url').value.trim();
  const result = document.getElementById('result');
  const status = document.getElementById('status');

  let cleanUrl = formUrl.split('/viewform')[0].split('/formResponse')[0] + '/viewform';
  
  status.innerText = "ডেটা আনা হচ্ছে...";
  result.innerHTML = '';

  try {
    const res = await fetch(MY_WORKER_URL + "?url=" + encodeURIComponent(cleanUrl));
    const html = await res.text();
    
    // সরাসরি HTML থেকে entry. আইডি খোঁজা
    let ids = html.match(/entry\.\d+/g) || [];
    ids = [...new Set(ids)]; // ডুপ্লিকেট বাদ দেওয়া

    if(ids.length === 0){
      result.innerHTML = "<div class='card'>❌ Entry ID পাওয়া যায়নি। ফর্মটি পাবলিক কিনা চেক করুন।</div>";
      status.innerText = "";
      return;
    }

    let out = "<div class='card'>✅ মোট " + ids.length + " টি Entry ID পাওয়া গেছে:</div>";

    ids.forEach((id, i) => {
      out += `
      <div class="card">
        <div>প্রশ্ন ${i+1}</div>
        <div class="id">${id}</div>
        <button class="small-btn" onclick="navigator.clipboard.writeText('${id}'); this.innerText='Copied!'">Copy ID</button>
      </div>`;
    });

    result.innerHTML = out;
    status.innerText = "সফলভাবে সম্পন্ন!";
  } catch(e) {
    result.innerHTML = "<div class='card'>❌ Error: " + e.message + "</div>";
    status.innerText = "";
  }
}
</script>
</body>
</html>
