<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Form Entry ID Finder</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;padding:16px;max-width:650px;margin:auto;background:#f8f8ff}
h2{text-align:center;margin-bottom:5px}
p.sub{text-align:center;color:#555}
input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:15px}
button{padding:13px;width:100%;background:#673ab7;color:#fff;border:0;border-radius:10px;font-size:16px;margin-top:10px;cursor:pointer}
.card{background:#fff;padding:14px;margin-top:12px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.q{font-weight:bold;font-size:16px;margin-bottom:4px}
.id{color:#673ab7;margin:6px 0;word-break:break-all;font-size:14px}
.small{padding:8px 12px;width:auto;background:#eee;color:#000;font-size:13px;margin-top:5px;border-radius:6px;border:none;cursor:pointer;display:inline-block}
.prefill{width:100%;padding:10px;margin-top:10px}
#loader{display:none;text-align:center;margin-top:15px;font-weight:bold}
#status{font-size:13px;color:#888;text-align:center;margin-top:8px}
a{color:#673ab7;text-decoration:none;word-break:break-all}
</style>
</head>
<body>

<h2>🔍 Google Form Entry ID Finder</h2>
<p class="sub">শুধু Form এর লিংক Paste করো</p>

<input id="url" placeholder="https://docs.google.com/forms/d/e/.../viewform">
<button onclick="findIds()">Entry ID বের করো</button>
<div id="loader">খুঁজতেছি... ⏳</div>
<div id="status"></div>
<div id="result"></div>

<script>
// আপনার Cloudflare Worker এর লিংক
const MY_WORKER_URL = "https://my-form-proxy.rokib40560.workers.dev";

async function findIds(){
  const formUrl = document.getElementById('url').value.trim();
  const result = document.getElementById('result');
  const loader = document.getElementById('loader');
  const status = document.getElementById('status');

  if(!formUrl.includes('http')){
    alert('সঠিক লিংক দাও');
    return;
  }

  let cleanUrl = formUrl;
  if(cleanUrl.includes('forms.gle')){
    result.innerHTML = "<div class='card'>⚠️ forms.gle শর্ট লিংক কাজ করবে না।<br><br>👉 Chrome এ লিংকটা ওপেন করে পুরো লিংক কপি করে আনো।</div>";
    return;
  }
  
  if(!cleanUrl.includes('/viewform') && !cleanUrl.includes('/formResponse')){
    if(cleanUrl.endsWith('/')) cleanUrl = cleanUrl.slice(0,-1);
    cleanUrl += '/viewform';
  }
  cleanUrl = cleanUrl.replace('/formResponse', '/viewform');

  loader.style.display = 'block';
  status.innerText = "Cloudflare Proxy দিয়ে ডেটা আনা হচ্ছে...";
  result.innerHTML = '';

  try {
    const fetchUrl = MY_WORKER_URL + "?url=" + encodeURIComponent(cleanUrl);
    const res = await fetch(fetchUrl);
    
    if(!res.ok) throw new Error("Worker response failed. Status: " + res.status);
    
    const html = await res.text();
    
    const dataMatch = html.match(/FB_PUBLIC_LOAD_DATA_\s*=\s*(\[[\s\S]*?\]);?\s*<\/script>/);
    let ids = [];
    
    if(dataMatch){
      try {
        const data = JSON.parse(dataMatch[1]);
        if(data && data[1]) {
          data[1].forEach(item => {
            if(item && item[1] && item[4]){
              item[4].forEach(subItem => {
                if(subItem && subItem[0]) {
                   let entry = subItem[0];
                   let label = item[1];
                   ids.push({ id: entry, label: label });
                }
              });
            }
          });
        }
      } catch(e){ console.log("JSON parse error:", e); }
    }

    if(ids.length === 0){
      let rawIds = [...new Set(html.match(/entry\.\d+/g) || [])];
      rawIds.forEach((id, index) => {
        ids.push({ id: id, label: "প্রশ্ন " + (index + 1) });
      });
    }

    if(ids.length === 0){
      result.innerHTML = "<div class='card'>❌ Entry ID পাওয়া যায়নি। ফর্মটি পাবলিক কিনা চেক করো।</div>";
      loader.style.display = 'none';
      status.innerText = '';
      return;
    }

    const baseUrl = cleanUrl;
    const formResponseUrl = baseUrl.replace('/viewform', '/formResponse');
    window._ids = ids.map(x => x.id);
    window._baseUrl = baseUrl;

    let out = `
    <div class="card" style="background:#e8e5ff">
      <div class="q">🔗 FormResponse Link</div>
      <div class="id">${formResponseUrl}</div>
      <button class="small" style="background:#673ab7;color:#fff" onclick="copyText('${formResponseUrl}', this)">Copy</button>
    </div>
    <div class="card" style="background:#e8e5ff">
      <div class="q">👁️ ViewForm Link</div>
      <div class="id">${baseUrl}</div>
      <button class="small" style="background:#673ab7;color:#fff" onclick="copyText('${baseUrl}', this)">Copy</button>
    </div>
    <h3>✅ মোট ${ids.length} টি প্রশ্ন পাওয়া গেছে</h3>`;

    ids.forEach((item, i) => {
      out += `
      <div class="card">
        <div class="q">${item.label}</div>
        <div class="id">${item.id}</div>
        <button class="small" onclick="copyText('${item.id}', this)">Copy ID</button>
        <input class="prefill" id="val-${i}" placeholder="উত্তর লিখো...">
        <button class="small" style="background:#673ab7;color:#fff" onclick="makePrefill('${item.id}', ${i})">Prefill Link বানাও</button>
        <div id="link-${i}" style="word-break:break-all;margin-top:8px"></div>
      </div>`;
    });

    out += `<button onclick="makeAllPrefill()">সব উত্তর দিয়ে একসাথে Prefill Link বানাও</button>
            <div id="allLink" style="word-break:break-all;margin-top:10px"></div>`;
            
    result.innerHTML = out;
    status.innerText = "সফলভাবে সম্পন্ন!";
  } catch(e) {
    result.innerHTML = `<div class='card'>❌ Error: ${e.message}<br><br>Worker লিংক ঠিকমতো বসানো হয়েছে কিনা চেক করো।</div>`;
    status.innerText = "";
  }
  loader.style.display = 'none';
}

function copyText(text, btn){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>{
      const old = btn.innerText;
      btn.innerText = 'Copied ✅';
      setTimeout(()=>btn.innerText=old, 1500);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); btn.innerText = 'Copied ✅'; }catch(e){}
    document.body.removeChild(ta);
  }
}

function makePrefill(id, i){
  const val = document.getElementById('val-'+i).value;
  const link = window._baseUrl + "?usp=pp_url&" + id + "=" + encodeURIComponent(val);
  document.getElementById('link-'+i).innerHTML = `<a href="${link}" target="_blank">${link}</a><br><button class="small" onclick="copyText('${link}', this)">Copy Link</button>`;
}

function makeAllPrefill(){
  const params = window._ids.map((id,i)=>{
    const v = document.getElementById('val-'+i)?.value || "";
    return id + "=" + encodeURIComponent(v);
  }).join('&');
  const link = window._baseUrl + "?usp=pp_url&" + params;
  document.getElementById('allLink').innerHTML = `<a href="${link}" target="_blank">${link}</a><br><button class="small" onclick="copyText('${link}', this)">Copy Full Link</button>`;
}
</script>
</body>
</html>
