<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Form Entry ID Finder</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    padding: 16px;
    max-width: 600px;
    margin: auto;
    background: #f4f5f9;
}

h2 {
    text-align: center;
    color: #333;
}

.sub {
    text-align: center;
    color: #777;
}

.input-box {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 12px;
}

.main-btn {
    width: 100%;
    padding: 14px;
    background: #673ab7;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
}

.card {
    background: white;
    padding: 16px;
    margin-top: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #0001;
}

.title {
    font-weight: bold;
    font-size: 16px;
    color: #333;
}

.entry-id {
    color: #673ab7;
    font-size: 18px;
    font-weight: bold;
    margin: 12px 0;
    word-break: break-all;
}

.copy-btn {
    padding: 10px 16px;
    background: #eee;
    border: none;
    border-radius: 7px;
    font-weight: bold;
}

#status {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<h2>🔍 Form Entry ID Finder</h2>
<p class="sub">শুধু Google Form এর লিংক দিন</p>

<input
 type="url"
 id="url"
 class="input-box"
 placeholder="Paste Google Form Link Here"
>

<button class="main-btn" onclick="findIds()">
Entry ID বের করো
</button>

<div id="status"></div>
<div id="result"></div>

<script>

const WORKER_URL =
"https://my-form-proxy.rokib40560.workers.dev";

// URL থেকে Google Form Link নেওয়া
const params = new URLSearchParams(window.location.search);
const sharedUrl = params.get("url");

if (sharedUrl) {
    document.getElementById("url").value = sharedUrl;
    window.history.replaceState({}, "", window.location.pathname);
}

async function findIds() {

    const formUrl = document.getElementById("url").value.trim();
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    result.innerHTML = "";

    let parsed;

    try {
        parsed = new URL(formUrl);

        if (
            parsed.hostname !== "docs.google.com" ||
            !parsed.pathname.includes("/forms/")
        ) throw new Error();

    } catch {
        status.innerText = "❌ সঠিক Google Form Link দিন";
        return;
    }

    let baseUrl = formUrl.split("?")[0].replace(/\/+$/, "");

    if (!baseUrl.endsWith("/viewform")) {
        baseUrl += "/viewform";
    }

    status.innerText = "⏳ Loading...";

    try {

        const response = await fetch(
            WORKER_URL + "?url=" + encodeURIComponent(baseUrl)
        );

        if (!response.ok) {
            throw new Error("Worker Error: " + response.status);
        }

        const html = await response.text();

        const match = html.match(
            /FB_PUBLIC_LOAD_DATA_\s*=\s*(\[[\s\S]*?\]);/
        );

        if (!match) {
            throw new Error("Google Form Data পাওয়া যায়নি");
        }

        const data = JSON.parse(match[1]);
        const items = data?.[1]?.[1];

        let questions = [];
        let seen = new Set();

        function scan(obj) {

            if (!Array.isArray(obj)) return;

            for (const item of obj) {

                if (
                    Array.isArray(item) &&
                    typeof item[1] === "string" &&
                    Array.isArray(item[4]) &&
                    Array.isArray(item[4][0])
                ) {

                    const rawId = item[4][0][0];
                    const id = String(rawId);

                    if (/^\d+$/.test(id) && !seen.has(id)) {

                        seen.add(id);

                        questions.push({
                            name: item[1],
                            id: "entry." + id
                        });
                    }
                }
            }
        }

        scan(items);

        if (!questions.length) {
            throw new Error("Entry ID পাওয়া যায়নি");
        }

        questions.forEach((q) => {

            const card = document.createElement("div");
            card.className = "card";

            const title = document.createElement("div");
            title.className = "title";
            title.textContent = q.name;

            const id = document.createElement("div");
            id.className = "entry-id";
            id.textContent = q.id;

            const button = document.createElement("button");
            button.className = "copy-btn";
            button.textContent = "Copy ID";

            button.onclick = () => copyID(q.id, button);

            card.append(title, id, button);
            result.appendChild(card);

        });

        status.innerText =
            "✅ সফলভাবে " + questions.length +
            " টি Entry ID পাওয়া গেছে!";

    } catch (error) {

        status.innerText = "❌ " + error.message;

    }
}

async function copyID(id, button) {

    try {

        await navigator.clipboard.writeText(id);
        button.textContent = "Copied ✅";

    } catch {

        const input = document.createElement("textarea");
        input.value = id;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();

        button.textContent = "Copied ✅";
    }

}

</script>

</body>
</html>
